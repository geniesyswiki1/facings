# Showing Up web app. SPEC 3.2 screens and the hosted protocol endpoints.
#
# The endpoints an agent crawler reads are public and unauthenticated by
# design: the UCP manifest and the product feeds are discovery surfaces, and
# requiring a credential to read them would defeat the point.

[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# The manifest is fetched by crawlers that expect JSON and no redirect.
[[headers]]
  for = "/.well-known/ucp"
  [headers.values]
    Content-Type = "application/json"
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/feeds/*"
  [headers.values]
    Cache-Control = "public, max-age=300"
